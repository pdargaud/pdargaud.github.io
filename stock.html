<title>Veille stock — tableau de bord</title>
<style>
  :root{
    --bg:#f4f3f0;
    --surface:#ffffff;
    --surface-2:#faf9f7;
    --ink:#1b1b18;
    --ink-soft:#46453f;
    --muted:#85837b;
    --faint:#a9a79e;
    --line:#e7e5df;
    --line-strong:#d8d5cd;
    --best:#157347;        /* meilleur prix */
    --best-bg:#e8f3ec;
    --warn:#b25a00;        /* écart moyen */
    --warn-bg:#f6ece0;
    --hot:#c0392b;         /* gros écart */
    --hot-bg:#f7e6e3;
    --pk:#d23b32;          /* Pokémon */
    --op:#d39200;          /* One Piece */
    --lc:#2f6fb0;          /* Lorcana */
    --misc:#8a887f;        /* Autres */
    --mono:"SF Mono",ui-monospace,"DejaVu Sans Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    --radius:7px;
    --shadow:0 1px 2px rgba(20,20,16,.05),0 1px 1px rgba(20,20,16,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:13.5px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit}

  /* ---------- header ---------- */
  header.app{
    position:sticky;top:0;z-index:30;
    background:rgba(244,243,240,.92);
    backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--line-strong);
  }
  .head-row{
    max-width:1180px;margin:0 auto;padding:11px 22px 0;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0;}
  .brand .date{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .head-stats{margin-left:auto;display:flex;gap:18px;font-size:11.5px;color:var(--muted);}
  .head-stats b{font-family:var(--mono);color:var(--ink-soft);font-weight:600;font-size:12.5px;}

  /* ---------- toolbar ---------- */
  .toolbar{
    max-width:1180px;margin:0 auto;padding:11px 22px 12px;
    display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;
  }
  .search{
    position:relative;flex:1 1 280px;min-width:220px;
  }
  .search input{
    width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
    background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--radius);padding:8px 30px 8px 32px;outline:none;
    transition:border-color .12s,box-shadow .12s;
  }
  .search input:focus{border-color:#b9b6ac;box-shadow:0 0 0 3px rgba(120,118,110,.12);}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;display:none;padding:2px;}
  .search .clear:hover{color:var(--ink);}

  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--radius);padding:2px;gap:2px;}
  .seg button{
    border:0;background:none;font-family:var(--sans);font-size:12.5px;font-weight:550;
    color:var(--muted);padding:5px 11px;border-radius:5px;cursor:pointer;white-space:nowrap;
    transition:background .12s,color .12s;
  }
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .seg button:not([aria-pressed="true"]):hover{color:var(--ink);}

  select.sort{
    font-family:var(--sans);font-size:12.5px;font-weight:550;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:6px 26px 6px 10px;cursor:pointer;outline:none;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3l4 4 4-4' fill='none' stroke='%2385837b' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center;
  }

  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chip{
    border:1px solid var(--line-strong);background:var(--surface);
    font-family:var(--sans);font-size:12px;font-weight:550;color:var(--ink-soft);
    padding:5px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .chip:hover{border-color:#c4c1b8;}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip[aria-pressed="true"] .ct{color:rgba(255,255,255,.7);}
  .chip .ct{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:600;}

  .filterbar{
    max-width:1180px;margin:0 auto;padding:0 22px 12px;
    display:flex;gap:18px 26px;align-items:center;flex-wrap:wrap;
  }
  .fgroup{display:flex;align-items:center;gap:8px;}
  .fgroup>.lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:650;}
  .btn-link{border:0;background:none;color:var(--muted);font-family:var(--sans);font-size:12px;
    font-weight:550;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line-strong);}
  .btn-link:hover{color:var(--ink);}

  /* groupe de puces de filtre — replié derrière un bouton compact sous 820px (mobile) */
  .filterbar-body{display:flex;gap:18px 26px;align-items:center;flex-wrap:wrap;flex:1 1 auto;}
  .filter-toggle{
    display:none;align-items:center;gap:7px;
    border:1px solid var(--line-strong);background:var(--surface);
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);
    padding:6px 12px;border-radius:var(--radius);cursor:pointer;
  }
  .filter-toggle:hover{border-color:#c4c1b8;}
  .filter-toggle .fcaret{color:var(--faint);font-size:11px;transition:transform .15s;}
  .filter-toggle[aria-expanded="true"] .fcaret{transform:rotate(180deg);}
  .filter-toggle .fcount{
    font-family:var(--mono);font-size:10px;font-weight:700;line-height:1;
    background:var(--ink);color:#fff;border-radius:999px;padding:2px 6px;min-width:16px;text-align:center;
  }

  /* ---------- main ---------- */
  main{max-width:1180px;margin:0 auto;padding:18px 22px 80px;}
  .resultline{font-size:11.5px;color:var(--muted);padding:2px 2px 12px;font-family:var(--mono);}
  .resultline b{color:var(--ink-soft);}

  /* universe section */
  .uni{margin-bottom:14px;}
  .uni-head{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;cursor:pointer;padding:7px 4px;border-bottom:1.5px solid var(--line-strong);
  }
  .uni-head .caret{color:var(--faint);transition:transform .15s;flex:none;}
  .uni.collapsed .uni-head .caret{transform:rotate(-90deg);}
  .uni-head .ubar{width:9px;height:9px;border-radius:50%;flex:none;}
  .uni-head h2{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;}
  .uni-head .umeta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .uni-body{padding-top:6px;}
  .uni.collapsed .uni-body{display:none;}

  /* set group */
  .setgrp{margin:8px 0 4px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);box-shadow:var(--shadow);overflow:hidden;}
  .set-head{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:var(--surface-2);border:0;border-bottom:1px solid var(--line);
    cursor:pointer;padding:8px 13px;
  }
  .set-head .caret{color:var(--faint);transition:transform .15s;flex:none;}
  .setgrp.collapsed .set-head{border-bottom:0;}
  .setgrp.collapsed .set-head .caret{transform:rotate(-90deg);}
  .set-head .sname{font-size:13px;font-weight:650;letter-spacing:-.005em;}
  .set-head .scount{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;}
  .setgrp.collapsed .set-body{display:none;}

  /* product row */
  .prod{border-top:1px solid var(--line);}
  .setgrp .set-body>.prod:first-child{border-top:0;}
  .prod-main{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto auto auto;
    align-items:center;gap:12px;padding:7px 13px;cursor:pointer;
    transition:background .1s;
  }
  .prod-main:hover{background:var(--surface-2);}
  .badge-type{
    font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 6px;border-radius:4px;background:#efede7;color:var(--ink-soft);white-space:nowrap;
  }
  .badge-type[data-t="display"]{background:#e8eef5;color:#2d567f;}
  .badge-type[data-t="demi-display"]{background:#eef2f8;color:#476089;}
  .badge-type[data-t="display-minitin"]{background:#e9f1ef;color:#3a6b64;}
  .badge-type[data-t="etb"]{background:#ede9f4;color:#5a4a86;}
  .badge-type[data-t="coffret"]{background:#f1ece2;color:#7a5a25;}
  .badge-type[data-t="bundle"]{background:#e6f0ea;color:#2f6b4a;}
  .badge-type[data-t="bundle-display"]{background:#f3ebe6;color:#84543a;}
  .badge-type[data-t="upc"]{background:#f3e7ee;color:#8a3d6b;}
  .badge-type[data-t="spc"]{background:#efe7f3;color:#6b3d8a;}
  .pname{min-width:0;}
  .pname .t{font-size:13px;font-weight:550;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pname .ctx{display:none;font-size:10.5px;color:var(--muted);}
  .deals-view .pname .ctx{display:block;}
  .best-cell{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .best-cell .price{font-family:var(--mono);font-size:14.5px;font-weight:650;color:var(--ink);letter-spacing:-.01em;}
  .best-cell .seller{font-size:10.5px;color:var(--best);font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ocount{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;text-align:right;min-width:54px;}
  .ocount.solo{color:#c2bfb6;}
  .pexpand{color:var(--faint);transition:transform .15s;}
  .prod.open .prod-main .pexpand{transform:rotate(90deg);}

  /* offers */
  .offers{display:none;padding:2px 13px 11px 13px;background:var(--surface-2);
    border-top:1px solid var(--line);}
  .prod.open .offers{display:block;}
  table.off{width:100%;border-collapse:collapse;margin-top:6px;}
  table.off th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    font-weight:650;text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);}
  table.off th.num{text-align:right;}
  table.off td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.off tr:last-child td{border-bottom:0;}
  table.off .rk{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:22px;}
  table.off .st{font-weight:550;font-size:12.5px;}
  table.off .pr{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap;font-weight:550;}
  table.off .lk{text-align:right;width:48px;}
  table.off .lk a{font-size:11px;color:var(--muted);text-decoration:none;border:1px solid var(--line-strong);
    border-radius:5px;padding:2px 7px;display:inline-flex;gap:3px;align-items:center;transition:.12s;}
  table.off .lk a:hover{color:var(--ink);border-color:#bdbab1;background:var(--surface);}
  table.off tr.cheapest td{background:var(--best-bg);}
  table.off tr.cheapest .st{color:var(--best);}
  table.off tr.cheapest .pr{color:var(--best);font-weight:700;}
  table.off tr.cheapest .tag{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.04em;
    color:#fff;background:var(--best);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:middle;}
  table.off .title-sm{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:520px;}
  .cmref{display:none;gap:7px;align-items:center;padding:6px 12px 9px;font-size:11px;color:var(--muted);background:var(--surface-2);}
  .prod.open .cmref{display:flex;}
  .cmref .cmlbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);}
  .cmref .cmprice{font-family:var(--mono);font-weight:700;color:var(--best);}
  .cmref a{color:var(--muted);text-decoration:none;border:1px solid var(--line-strong);border-radius:5px;padding:1px 7px;}
  .cmref a:hover{color:var(--ink);border-color:#bdbab1;background:var(--surface);}
  .cmref.nok{color:var(--faint);font-style:italic;}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
  .empty b{color:var(--ink);}

  .footnote{max-width:1180px;margin:0 auto;padding:0 22px;color:var(--faint);font-size:11px;line-height:1.5;}

  /* mobile : les puces de filtre se replient derrière le bouton « Filtres ▾ » pour ne pas
     manger l'écran. Ne pas supprimer en ajoutant de nouveaux types — ajouter juste la puce. */
  @media (max-width:820px){
    .filter-toggle{display:inline-flex;}
    .filterbar-body{display:none;flex-basis:100%;}
    .filterbar-body.open{display:flex;}
  }

  @media (max-width:680px){
    .head-row,.toolbar,.filterbar,main,.footnote{padding-left:14px;padding-right:14px;}
    .prod-main{grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;}
    .ocount{display:none;}
    .head-stats{width:100%;margin:4px 0 0;gap:14px;}
    .search{flex:1 1 100%;}
    .seg,select.sort{flex:1 1 auto;}
    .best-cell .seller{max-width:120px;}
    table.off .title-sm{display:none;}
    .uni-head h2{font-size:14px;}
  }
</style>
</head>

<script>
(function(){
  "use strict";
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ---------------- price parsing ---------------- */
  function parsePrice(raw){
    if(!raw) return NaN;
    let s = raw.replace(/\*\*/g,"").replace(/€/g,"").trim();
    s = s.replace(/[^\d.,]/g,"");
    if(!s) return NaN;
    // last separator (',' or '.') is the decimal one
    const lastComma = s.lastIndexOf(","), lastDot = s.lastIndexOf(".");
    if(lastComma>-1 && lastDot>-1){
      if(lastComma>lastDot){ s = s.replace(/\./g,"").replace(",", "."); }
      else { s = s.replace(/,/g,""); }
    } else if(lastComma>-1){
      s = s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isNaN(n)?NaN:n;
  }
  const fmtEuro = n => (Number.isInteger(n)?n.toLocaleString("fr-FR"):n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}))+" €";

  /* ---------------- type normalisation ---------------- */
  function typeKey(t){
    const x = t.toLowerCase();
    if(x.includes("demi")) return "demi-display";
    if(x.includes("mini-tin")||x.includes("mini tin")) return "display-minitin";
    if(x.includes("display de bundle")) return "bundle-display";
    if(x.includes("display")) return "display";
    if(x.includes("etb")||x.includes("trove")) return "etb";
    if(x.includes("bundle")) return "bundle";
    if(x.includes("ultra premium")||x.includes("upc")) return "upc";
    if(x.includes("super premium")||x.includes("spc")) return "spc";
    if(x.includes("coffret")) return "coffret";
    return "autre";
  }
  const TYPE_LABEL = {display:"Display","demi-display":"Demi-display","display-minitin":"Disp. mini-tins",etb:"ETB",upc:"UPC",spc:"SPC",coffret:"Coffret",bundle:"Bundle","bundle-display":"Disp. bundle",autre:"Autre"};

  function uniMeta(name){
    const n = name.toLowerCase();
    if(n.includes("pokémon")||n.includes("pokemon")) return {key:"pokemon",color:"var(--pk)",clean:"Pokémon"};
    if(n.includes("one piece")) return {key:"onepiece",color:"var(--op)",clean:"One Piece"};
    if(n.includes("lorcana")) return {key:"lorcana",color:"var(--lc)",clean:"Lorcana"};
    return {key:"autres",color:"var(--misc)",clean:"Autres"};
  }

  /* ---------------- markdown parser ---------------- */
  function parseRow(line){
    const cells = line.split("|").slice(1,-1).map(c=>c.trim());
    if(cells.length<2) return null;
    const [site,price,link,title] = cells;
    let url="";
    const m = (link||"").match(/\(([^)]+)\)/);
    if(m) url=m[1];
    const bold = /\*\*/.test(site)||/\*\*/.test(price);
    return {
      site:(site||"").replace(/\*\*/g,"").trim(),
      priceRaw:(price||"").replace(/\*\*/g,"").trim(),
      priceNum:parsePrice(price),
      url,
      title:(title||"").replace(/\*\*/g,"").trim(),
      bold
    };
  }

  function parse(md){
    const lines = md.split(/\r?\n/);
    let title="Veille stock", date="";
    const universes=[]; let cu=null, cs=null, cp=null, tableMode=null, inUnmatched=false;
    const sitesSet=new Set();
    let offTotal=0, prodTotal=0;
    const stripEmoji = s => s.replace(/^(\p{Emoji}|\p{Extended_Pictographic}|\uFE0F|\s)+/u,"").trim();

    for(let i=0;i<lines.length;i++){
      const ln = lines[i];
      const t = ln.trim();
      if(!t) continue;

      // top title (first H1 that is not an emoji universe)
      if(/^#\s/.test(t) && !/^##/.test(t)){
        const txt = t.replace(/^#\s+/,"").trim();
        const mDate = txt.match(/(\d{4}-\d{2}-\d{2})/);
        if(/veille/i.test(txt) && universes.length===0 && !cu){
          title = txt.replace(/\s*—\s*\d{4}-\d{2}-\d{2}\s*$/,"").trim();
          if(mDate) date=mDate[1];
          continue;
        }
        // universe header
        const emoji=(txt.match(/^(\p{Emoji}|\p{Extended_Pictographic})+/u)||[""])[0];
        const meta = uniMeta(txt);
        // Section « Non rattaché à un set » : pas d'univers « Autres ».
        // Les sous-sections ## <Univers> rerouteront vers l'univers réel.
        if(meta.key==="autres"){ inUnmatched=true; cu=null; cs=null; cp=null; tableMode=null; continue; }
        inUnmatched=false;
        cu={name:meta.clean,raw:txt,emoji,...meta,sets:[]};
        universes.push(cu); cs=null; cp=null; tableMode=null;
        continue;
      }
      // set header
      if(/^##\s/.test(t)){
        const sname=stripEmoji(t.replace(/^##\s+/,""))||t.replace(/^##\s+/,"").trim();
        if(inUnmatched){
          // le titre nomme l'univers (## 🔴 Pokémon) -> rejoindre l'univers réel
          const m2=uniMeta(sname); let tu=universes.find(u=>u.key===m2.key);
          if(!tu){ tu={name:m2.clean,raw:sname,emoji:"",...m2,sets:[]}; universes.push(tu); }
          cu=tu;
          const LBL="Non rattaché à un set";
          cs=tu.sets.find(s=>s.name===LBL);
          if(!cs){ cs={name:LBL,products:[]}; tu.sets.push(cs); }
          cp=null; tableMode=null;
          continue;
        }
        if(!cu){ cu={name:"Autres",raw:"Autres",emoji:"",...uniMeta("autres"),sets:[]}; universes.push(cu); }
        cs={name:sname,products:[]};
        cu.sets.push(cs); cp=null; tableMode=null;
        continue;
      }
      // product type line: **Type** — Name
      const pm = t.match(/^\*\*([^*]+)\*\*\s*[—–-]\s*(.*)$/);
      if(pm){
        if(!cs){ cs={name:"—",products:[]}; (cu||(cu={name:"Autres",raw:"Autres",emoji:"",...uniMeta("autres"),sets:[]},universes.push(cu),cu)).sets.push(cs); }
        cp={type:pm[1].trim(),tkey:typeKey(pm[1]),name:(pm[2]||"").trim(),offers:[]};
        cs.products.push(cp); prodTotal++; tableMode=null;
        continue;
      }
      // cardmarket ref line: > [cmref] statut | idProduct | url
      if(t.startsWith("> [cmref]")){
        if(cp){
          const parts=t.replace("> [cmref]","").split("|").map(x=>x.trim());
          cp.cm={statut:parts[0]||"",id:parts[1]||"",url:parts[2]||"",price:parts[3]||"",date:parts[4]||""};
        }
        continue;
      }
      // ----- table handling (two schemas) -----
      // header rows define the schema of the following table
      if(/^\|\s*Article\s*\|/i.test(t)){ tableMode="articles"; continue; }
      if(/^\|\s*Site\s*\|/i.test(t)){ tableMode="offers"; continue; }
      if(/^\|[\s|:\-]+\|?$/.test(t)) continue;          // separator
      if(t.startsWith("|")){
        // "articles" schema: | Article | Type | Site | Prix | Lien |  → one product per row
        if(tableMode==="articles"){
          const c=t.split("|").slice(1,-1).map(x=>x.trim());
          if(c.length>=4){
            if(!cs){ cs={name:"—",products:[]}; (cu||(cu={name:"Autres",raw:"Autres",emoji:"",...uniMeta("autres"),sets:[]},universes.push(cu),cu)).sets.push(cs); }
            const [article,typ,site,price,link]=c;
            let url=""; const mm=(link||"").match(/\(([^)]+)\)/); if(mm) url=mm[1];
            const prod={type:(typ||"Autre"),tkey:typeKey(typ||""),name:article,offers:[{
              site:(site||"").trim(), priceRaw:(price||"").trim(), priceNum:parsePrice(price),
              url, title:article, bold:false
            }]};
            cs.products.push(prod); prodTotal++; offTotal++;
            if(site) sitesSet.add(site.trim().toLowerCase());
          }
          continue;
        }
        // "offers" schema (default): rows append to current product
        const row = parseRow(t);
        if(row && cp){ cp.offers.push(row); offTotal++; if(row.site) sitesSet.add(row.site.toLowerCase()); }
        continue;
      }
      // blockquotes / notes ignored
    }

    // compute stats per product
    universes.forEach(u=>{
      u.sets.forEach(s=>{
        s.products.forEach(p=>{
          const nums = p.offers.map(o=>o.priceNum).filter(n=>!isNaN(n));
          p.count = p.offers.length;
          if(nums.length){
            p.min=Math.min(...nums); p.max=Math.max(...nums);
            p.gap=p.max-p.min; p.gapPct=p.min>0?(p.gap/p.min*100):0;
          } else { p.min=NaN;p.max=NaN;p.gap=0;p.gapPct=0; }
          // sort offers ascending by price, NaN last
          p.offers.sort((a,b)=>{
            const x=isNaN(a.priceNum)?Infinity:a.priceNum, y=isNaN(b.priceNum)?Infinity:b.priceNum;
            return x-y;
          });
          p.cheapest = p.offers.find(o=>!isNaN(o.priceNum)) || p.offers[0];
        });
      });
    });

    return {title,date,universes,stats:{prod:prodTotal,off:offTotal,sites:sitesSet.size}};
  }

  /* ---------------- state ---------------- */
  const DATA = parse(document.getElementById("veille-data").textContent || "");
  const state = {
    view:"uni",
    q:"",
    universes:new Set(),  // empty = all
    types:new Set(),      // empty = all
    sort:"ecart",
    collapsedUni:new Set(),
    collapsedSet:new Set(),
    openProd:new Set(),
    allCollapsed:true
  };
  // Par défaut tout est replié : chaque univers ET chaque set.
  DATA.universes.forEach(u=>{
    state.collapsedUni.add(u.key);
    u.sets.forEach(s=>state.collapsedSet.add(u.key+"|"+s.name));
  });

  /* ---------------- header / chips ---------------- */
  document.getElementById("title").textContent = DATA.title || "Veille stock";
  document.getElementById("date").textContent = DATA.date ? "· "+DATA.date : "";
  document.getElementById("st-prod").textContent = DATA.stats.prod;
  document.getElementById("st-off").textContent = DATA.stats.off;
  document.getElementById("st-sites").textContent = DATA.stats.sites;
  document.title = (DATA.title||"Veille stock") + (DATA.date?" — "+DATA.date:"");

  // universe chips
  const uniChips = document.getElementById("uni-chips");
  DATA.universes.forEach(u=>{
    const n = u.sets.reduce((a,s)=>a+s.products.length,0);
    const b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed","false");b.dataset.key=u.key;
    b.innerHTML=`<span class="dot" style="background:${u.color}"></span>${esc(u.name)} <span class="ct">${n}</span>`;
    b.onclick=()=>{ toggleSet(state.universes,u.key); syncChips(uniChips,state.universes); render(); };
    uniChips.appendChild(b);
  });
  // type chips (from data, ordered)
  const typeOrder=["display","demi-display","display-minitin","etb","upc","spc","coffret","bundle","bundle-display","autre"];
  const typeCounts={};
  DATA.universes.forEach(u=>u.sets.forEach(s=>s.products.forEach(p=>{typeCounts[p.tkey]=(typeCounts[p.tkey]||0)+1;})));
  const typeChips=document.getElementById("type-chips");
  typeOrder.filter(k=>typeCounts[k]).forEach(k=>{
    const b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed","false");b.dataset.key=k;
    b.innerHTML=`${esc(TYPE_LABEL[k])} <span class="ct">${typeCounts[k]}</span>`;
    b.onclick=()=>{ toggleSet(state.types,k); syncChips(typeChips,state.types); render(); };
    typeChips.appendChild(b);
  });
  function toggleSet(set,key){ set.has(key)?set.delete(key):set.add(key); }
  function syncChips(container,set){
    container.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", set.has(c.dataset.key)?"true":"false"));
  }

  // repli mobile des filtres + badge du nombre de filtres actifs
  const filterToggle=document.getElementById("filter-toggle");
  const filterBody=document.getElementById("filterbar-body");
  const fcountEl=document.getElementById("fcount");
  filterToggle.onclick=()=>{
    const open=filterBody.classList.toggle("open");
    filterToggle.setAttribute("aria-expanded",open?"true":"false");
  };
  function updateFcount(){
    const n=state.universes.size+state.types.size;
    fcountEl.textContent=n;
    fcountEl.hidden = n===0;
  }

  /* ---------------- controls ---------------- */
  const qEl=document.getElementById("q"), qClear=document.getElementById("qclear");
  qEl.addEventListener("input",()=>{ state.q=qEl.value.trim().toLowerCase(); qClear.style.display=qEl.value?"block":"none"; render(); });
  qClear.onclick=()=>{ qEl.value="";state.q="";qClear.style.display="none";render();qEl.focus(); };

  const vUni=document.getElementById("v-uni"), vDeals=document.getElementById("v-deals");
  vUni.onclick=()=>setView("uni"); vDeals.onclick=()=>setView("deals");
  function setView(v){
    state.view=v;
    vUni.setAttribute("aria-pressed",v==="uni");
    vDeals.setAttribute("aria-pressed",v==="deals");
    document.getElementById("toggle-all").style.visibility = v==="uni"?"visible":"hidden";
    if(v==="deals" && state.sort==="alpha") { state.sort="ecart"; document.getElementById("sort").value="ecart"; }
    render();
  }
  document.getElementById("sort").addEventListener("change",e=>{ state.sort=e.target.value; render(); });
  document.getElementById("toggle-all").onclick=()=>{
    state.allCollapsed=!state.allCollapsed;
    state.collapsedUni.clear(); state.collapsedSet.clear();
    if(state.allCollapsed){
      DATA.universes.forEach(u=>{
        state.collapsedUni.add(u.key);
        u.sets.forEach(s=>state.collapsedSet.add(u.key+"|"+s.name));
      });
    }
    document.getElementById("toggle-all").textContent = state.allCollapsed?"Tout déplier":"Tout replier";
    render();
  };

  /* ---------------- filtering / sorting ---------------- */
  function prodMatches(p,setName,uniName){
    if(state.types.size && !state.types.has(p.tkey)) return false;
    if(state.q){
      const hay=(p.name+" "+p.type+" "+setName+" "+uniName+" "+p.offers.map(o=>o.site+" "+o.title).join(" ")).toLowerCase();
      if(!hay.includes(state.q)) return false;
    }
    return true;
  }
  function sortProds(arr){
    const s=state.sort;
    const cp=[...arr];
    cp.sort((a,b)=>{
      if(s==="ecart") return (b.gapPct||0)-(a.gapPct||0) || (b.gap||0)-(a.gap||0);
      if(s==="prix-asc") return (isNaN(a.min)?Infinity:a.min)-(isNaN(b.min)?Infinity:b.min);
      if(s==="prix-desc") return (isNaN(b.min)?-Infinity:b.min)-(isNaN(a.min)?-Infinity:a.min);
      if(s==="alpha") return (a.setName||"").localeCompare(b.setName||"","fr")||a.name.localeCompare(b.name,"fr");
      return 0;
    });
    return cp;
  }
  function gapLevel(pct){ return pct>=30?"hi":pct>=10?"mid":"lo"; }

  /* ---------------- rendering pieces ---------------- */
  function offersHTML(p){
    let rows="";
    p.offers.forEach((o,i)=>{
      const cheap = o===p.cheapest && !isNaN(o.priceNum);
      rows+=`<tr class="${cheap?'cheapest':''}">
        <td class="rk">${i+1}</td>
        <td class="st">${esc(o.site)}${cheap?'<span class="tag">MIN</span>':''}<div class="title-sm">${esc(o.title||"")}</div></td>
        <td class="pr">${isNaN(o.priceNum)?esc(o.priceRaw||"—"):fmtEuro(o.priceNum)}</td>
        <td class="lk">${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener">fiche ↗</a>`:""}</td>
      </tr>`;
    });
    return `<div class="offers"><table class="off">
      <thead><tr><th class="num">#</th><th>Site</th><th class="num">Prix</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  const CM_NOK={ambigu:"à choisir (variantes)",manquant:"à chercher",["hors-couverture"]:"non couvert"};
  function cmHTML(p){
    if(!p.cm) return "";
    if(p.cm.statut==="ok" && p.cm.id){
      const prix=p.cm.price?` · <span class="cmprice">dès ${esc(p.cm.price.replace(".",","))} €</span>`:"";
      return `<div class="cmref"><span class="cmlbl">Cardmarket</span> #${esc(p.cm.id)}${prix}`
        +(p.cm.url?` <a href="${esc(p.cm.url)}" target="_blank" rel="noopener">fiche ↗</a>`:"")+`</div>`;
    }
    return `<div class="cmref nok"><span class="cmlbl">Cardmarket</span> ${esc(CM_NOK[p.cm.statut]||p.cm.statut)}</div>`;
  }

  function prodHTML(p,pid,ctx){
    const open=state.openProd.has(pid);
    const nOff=p.count||0;
    const countCell=`<span class="ocount${nOff<=1?' solo':''}">${nOff} ${nOff>1?'offres':'offre'}</span>`;
    const seller = p.cheapest ? p.cheapest.site : "";
    const priceTxt = (p.cheapest && !isNaN(p.cheapest.priceNum)) ? fmtEuro(p.cheapest.priceNum) : (p.cheapest?esc(p.cheapest.priceRaw):"—");
    return `<div class="prod ${open?'open':''}" data-pid="${esc(pid)}">
      <div class="prod-main">
        <span class="badge-type" data-t="${p.tkey}">${esc(TYPE_LABEL[p.tkey]||p.type)}</span>
        <div class="pname">
          <div class="t">${esc(p.name||p.type)}</div>
          ${ctx?`<div class="ctx">${esc(ctx)}</div>`:""}
        </div>
        <div class="best-cell">
          <span class="price">${priceTxt}</span>
          <span class="seller">${esc(seller)}</span>
        </div>
        ${countCell}
        <svg class="pexpand" width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      ${offersHTML(p)}
      ${cmHTML(p)}
    </div>`;
  }

  /* ---------------- main render ---------------- */
  const listEl=document.getElementById("list");
  const resultEl=document.getElementById("resultline");

  function render(){
    updateFcount();
    listEl.classList.toggle("deals-view", state.view==="deals");
    let shownProd=0;

    if(state.view==="deals"){
      // flat ranked list
      let all=[];
      DATA.universes.forEach(u=>{
        if(state.universes.size && !state.universes.has(u.key)) return;
        u.sets.forEach(s=>s.products.forEach(p=>{
          if(prodMatches(p,s.name,u.name)){
            all.push({p,ctx:u.name+"  ›  "+s.name,setName:s.name,uniColor:u.color,pid:u.key+"|"+s.name+"|"+p.type+"|"+p.name});
          }
        }));
      });
      // attach setName for alpha sort
      all.forEach(o=>{o.p.setName=o.setName;});
      all = all.map(o=>o.p).map((p)=>p); // keep ref
      // sort by current sort using the product objects, but we need ctx; rebuild
      let items=[];
      DATA.universes.forEach(u=>{
        if(state.universes.size && !state.universes.has(u.key)) return;
        u.sets.forEach(s=>s.products.forEach(p=>{
          if(prodMatches(p,s.name,u.name)){ p.setName=s.name; items.push({p,ctx:u.name+"  ›  "+s.name,pid:u.key+"|"+s.name+"|"+p.type+"|"+p.name}); }
        }));
      });
      items.sort((a,b)=>{
        const s=state.sort, A=a.p,B=b.p;
        if(s==="ecart") return (B.gapPct||0)-(A.gapPct||0)||(B.gap||0)-(A.gap||0);
        if(s==="prix-asc") return (isNaN(A.min)?Infinity:A.min)-(isNaN(B.min)?Infinity:B.min);
        if(s==="prix-desc") return (isNaN(B.min)?-Infinity:B.min)-(isNaN(A.min)?-Infinity:A.min);
        return (a.ctx).localeCompare(b.ctx,"fr");
      });
      let html='<div class="setgrp"><div class="set-body">';
      items.forEach(it=>{ html+=prodHTML(it.p,it.pid,it.ctx); shownProd++; });
      html+='</div></div>';
      listEl.innerHTML = shownProd?html:emptyHTML();
      resultEl.innerHTML = shownProd?`<b>${shownProd}</b> produits — triés par écart de prix décroissant`:"";
      bind();
      return;
    }

    // grouped by universe
    let html="";
    DATA.universes.forEach(u=>{
      if(state.universes.size && !state.universes.has(u.key)) return;
      // gather matching sets/products
      let setBlocks=""; let uniCount=0;
      u.sets.forEach(s=>{
        let prods = s.products.filter(p=>prodMatches(p,s.name,u.name));
        if(!prods.length) return;
        prods.forEach(p=>p.setName=s.name);
        prods = sortProds(prods);
        const setKey=u.key+"|"+s.name;
        const collapsed=state.collapsedSet.has(setKey);
        let prodsHTML="";
        prods.forEach(p=>{ prodsHTML+=prodHTML(p,u.key+"|"+s.name+"|"+p.type+"|"+p.name,""); });
        setBlocks+=`<div class="setgrp ${collapsed?'collapsed':''}" data-setkey="${esc(setKey)}">
          <button class="set-head" data-setkey="${esc(setKey)}">
            <svg class="caret" width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="sname">${esc(s.name)}</span>
            <span class="scount">${prods.length} produit${prods.length>1?"s":""}</span>
          </button>
          <div class="set-body">${prodsHTML}</div>
        </div>`;
        uniCount+=prods.length; shownProd+=prods.length;
      });
      if(!setBlocks) return;
      const collapsed=state.collapsedUni.has(u.key);
      html+=`<section class="uni ${collapsed?'collapsed':''}" data-uni="${u.key}">
        <button class="uni-head" data-uni="${u.key}">
          <svg class="caret" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="ubar" style="background:${u.color}"></span>
          <h2>${esc(u.name)}</h2>
          <span class="umeta">${uniCount} produit${uniCount>1?"s":""}</span>
        </button>
        <div class="uni-body">${setBlocks}</div>
      </section>`;
    });
    listEl.innerHTML = shownProd?html:emptyHTML();
    resultEl.innerHTML = shownProd?`<b>${shownProd}</b> produits affichés`+(state.q||state.universes.size||state.types.size?" (filtré)":""):"";
    bind();
  }

  function emptyHTML(){
    return `<div class="empty"><b>Aucun résultat.</b><br>Essayez d'élargir la recherche ou de retirer des filtres.</div>`;
  }

  function bind(){
    listEl.querySelectorAll(".uni-head").forEach(b=>b.onclick=()=>{
      const k=b.dataset.uni; state.collapsedUni.has(k)?state.collapsedUni.delete(k):state.collapsedUni.add(k); render();
    });
    listEl.querySelectorAll(".set-head").forEach(b=>b.onclick=()=>{
      const k=b.dataset.setkey; state.collapsedSet.has(k)?state.collapsedSet.delete(k):state.collapsedSet.add(k); render();
    });
    listEl.querySelectorAll(".prod-main").forEach(m=>m.onclick=(e)=>{
      if(e.target.closest("a")) return;
      const pid=m.closest(".prod").dataset.pid;
      state.openProd.has(pid)?state.openProd.delete(pid):state.openProd.add(pid); render();
    });
  }

  // footnote
  document.getElementById("footnote").innerHTML =
    `Source : <code>${esc(document.querySelector("script#veille-data")? (DATA.title||"veille"):"")}</code>. `+
    `Données embarquées dans la page — pour mettre à jour, régénérez le fichier avec le nouveau Markdown. `+
    `Prix tels que relevés sur les sites marchands, susceptibles d'évoluer.`;

  render();
})();
</script>
</body>
</html>
